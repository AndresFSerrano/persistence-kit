[tool.poetry]
name = "persistence-kit"
version = "3.7.1"
description = "Reusable persistence and repository toolkit"
authors = ["Andres Felipe Serrano Barrios <andresfserrano1@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "persistence_kit" }]
include = ["persistence_kit/py.typed"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Typing :: Typed",
]
keywords = ["repository", "persistence", "mongodb", "sqlalchemy", "async"]
homepage = "https://pypi.org/project/persistence-kit/"
repository = "https://github.com/andresfserrano/persistence-kit"
documentation = "https://github.com/andresfserrano/persistence-kit#readme"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
motor = "^3.7.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.43"}
asyncpg = "^0.30.0"
typing-extensions = "^4.12.0"
pydantic-settings = "^2.3.0"
fastapi = {version = "^0.115.0", optional = true}
boto3 = {version = "^1.35.0", optional = true}
pyjwt = {version = "^2.10.1", extras = ["crypto"], optional = true}
python-multipart = {version = "^0.0.20", optional = true}
httpx = {version = "^0.28.0", optional = true}

[tool.poetry.extras]
api = ["fastapi", "python-multipart"]
storage-s3 = ["boto3"]
storage-routes = ["fastapi", "python-multipart"]
security = ["fastapi", "pyjwt", "python-multipart"]
security-cognito = ["fastapi", "pyjwt", "boto3", "python-multipart"]
dynamodb = ["boto3"]
restclient = ["httpx"]
testing = ["fastapi", "pyjwt", "python-multipart", "httpx"]
all = ["fastapi", "boto3", "pyjwt", "python-multipart", "httpx"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
