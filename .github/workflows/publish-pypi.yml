name: Publish to PyPI

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether this commit publishes
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          VERSION="$(sed -n -E 's/^version = "(.+)"/\1/p' pyproject.toml | head -n 1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          git fetch origin main --tags
          if [ "$EVENT" = "release" ]; then
            MAIN_SHA="$(git rev-parse origin/main)"
            if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
              echo "Release tag commit ($GITHUB_SHA) is not main HEAD ($MAIN_SHA)."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${VERSION} has no release yet; publishing it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distribution artifacts
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish package to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/persistence-kit/
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create the GitHub release
    needs: [plan, publish]
    if: github.event_name == 'push' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes
